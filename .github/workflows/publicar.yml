name: Publicar cierre de mercado

# El informe se sube apenas se genera, pero a la rama «staging», que Pages no
# sirve. Este flujo lo pasa a «main» recién cuando llega la hora de publicación
# que quedó escrita en publicar.json. Así el link nunca muestra el cierre nuevo
# antes de tiempo.

on:
  schedule:
    # Cada 15 minutos entre las 09:45 y las 11:00 de Buenos Aires (UTC-3).
    # El planificador de GitHub puede demorarse unos minutos, por eso la
    # ventana arranca antes: el flujo igual espera a la hora exacta.
    - cron: "45,59 12 * * 1-5"
    - cron: "14,29,44,59 13 * * 1-5"
  workflow_dispatch:
    inputs:
      forzar:
        description: "Publicar ahora, ignorando el embargo"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publicar-cierre
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Traer staging
        uses: actions/checkout@v5
        with:
          ref: staging
          path: staging
          fetch-depth: 0

      - name: ¿Hay algo pendiente y ya es la hora?
        id: chequeo
        run: |
          set -euo pipefail
          if [ ! -f staging/publicar.json ]; then
            echo "No hay cierre pendiente en staging."
            echo "seguir=no" >> "$GITHUB_OUTPUT"; exit 0
          fi

          CUANDO=$(python3 -c "import json;print(json.load(open('staging/publicar.json'))['publicar_desde'])")
          CIERRE=$(python3 -c "import json;print(json.load(open('staging/publicar.json'))['cierre'])")
          echo "Cierre del $CIERRE, se publica desde $CUANDO"
          echo "cierre=$CIERRE" >> "$GITHUB_OUTPUT"

          if [ "${{ inputs.forzar }}" = "true" ]; then
            echo "Publicación forzada a mano."
            echo "seguir=si" >> "$GITHUB_OUTPUT"; exit 0
          fi

          AHORA=$(date +%s)
          META=$(date -d "$CUANDO" +%s)
          if [ "$AHORA" -lt "$META" ]; then
            FALTA=$(( (META - AHORA) / 60 ))
            echo "Todavía no. Faltan $FALTA minuto(s)."
            echo "seguir=no" >> "$GITHUB_OUTPUT"
          else
            echo "seguir=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Traer main
        if: steps.chequeo.outputs.seguir == 'si'
        uses: actions/checkout@v5
        with:
          ref: main
          path: main
          fetch-depth: 0

      - name: Pasar el cierre a main
        if: steps.chequeo.outputs.seguir == 'si'
        run: |
          set -euo pipefail
          CIERRE="${{ steps.chequeo.outputs.cierre }}"

          # El archivo del día puede venir suelto (AAAA-MM-DD.html) o dentro de
          # la carpeta historico: se aceptan las dos formas.
          if [ -f "staging/historico/$CIERRE.html" ]; then
            DIA="staging/historico/$CIERRE.html"
          else
            DIA="staging/$CIERRE.html"
          fi
          FALTA=0
          if [ ! -f "staging/index.html" ]; then
            echo "::error::Falta index.html en la rama staging."
            FALTA=1
          fi
          if [ ! -f "$DIA" ]; then
            echo "::error::Falta $CIERRE.html en la rama staging."
            FALTA=1
          fi
          if [ "$FALTA" = "1" ]; then
            echo "Esto es lo que hay hoy en staging:"
            (cd staging && find . -path ./.git -prune -o -type f -print | sort)
            exit 1
          fi

          mkdir -p main/historico
          cp staging/index.html main/index.html
          cp "$DIA" "main/historico/$CIERRE.html"
          touch main/.nojekyll

          cd main
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html "historico/$CIERRE.html" .nojekyll
          if git diff --cached --quiet; then
            echo "Sin cambios: este cierre ya estaba publicado."
            exit 0
          fi
          git commit -m "Cierre de mercado del $CIERRE"
          git push origin main

      - name: Limpiar el pendiente
        if: steps.chequeo.outputs.seguir == 'si'
        run: |
          set -euo pipefail
          cd staging
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q --ignore-unmatch publicar.json index.html "${{ steps.chequeo.outputs.cierre }}.html"
          git rm -q -r --ignore-unmatch historico
          git commit -m "Publicado, se libera staging" || echo "Nada que limpiar"
          git push origin staging
